[project]
name = "hass-agent-gosling"
version = "0.2.0"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "aiohttp",
]
ha = [
    # homeassistant requires Python >=3.14.2; marker keeps the lockfile resolvable on older Pythons
    "pytest-homeassistant-custom-component==0.13.346 ; python_full_version >= '3.14.2'",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
